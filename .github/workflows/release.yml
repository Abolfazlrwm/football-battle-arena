name: release

# Cutting a release is tagging: push a v* tag and this workflow re-runs
# the whole verification (lint, typecheck, coverage), builds the site,
# and publishes a GitHub release with the notes already written in
# CHANGELOG.md under the matching version heading.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    name: verify, build, publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (lint, typecheck, coverage-gated tests)
        run: npm run verify

      - name: Build
        run: npm run build

      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for $VERSION — falling back to generated notes."
            rm -f release-notes.md
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "Football Battle Arena $GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Football Battle Arena $GITHUB_REF_NAME" \
              --generate-notes
          fi
