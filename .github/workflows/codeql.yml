name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly scan, Monday mornings — catches new advisories against
    # unchanged code, not just changes.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@v3
