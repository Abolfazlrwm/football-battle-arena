<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Big Shoulders Display";
    src: url("../node_modules/@fontsource/big-shoulders-display/files/big-shoulders-display-latin-900-normal.woff2") format("woff2");
    font-weight: 900;
  }
  @font-face {
    font-family: "IBM Plex Sans";
    src: url("../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2") format("woff2");
    font-weight: 400;
  }
  @font-face {
    font-family: "IBM Plex Sans";
    src: url("../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2") format("woff2");
    font-weight: 600;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; }

  .card {
    position: relative;
    width: 1200px;
    height: 630px;
    background: #07070a;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 72px 88px;
  }

  /* faint pitch-center circle, echoing the formation pitch component */
  .circle {
    position: absolute;
    right: -180px;
    top: -220px;
    width: 640px;
    height: 640px;
    border: 2px solid rgba(244, 245, 247, 0.08);
    border-radius: 50%;
  }
  .circle-inner {
    position: absolute;
    right: 40px;
    top: 0;
    width: 640px;
    height: 640px;
    border: 1px solid rgba(244, 245, 247, 0.05);
    border-radius: 50%;
  }
  .glow {
    position: absolute;
    right: -120px;
    bottom: -260px;
    width: 720px;
    height: 720px;
    background: radial-gradient(closest-side, rgba(79, 124, 255, 0.16), transparent);
  }

  .kicker {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    font: 600 22px/1 "IBM Plex Sans", sans-serif;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #82a2ff;
    margin-bottom: 26px;
  }
  .kicker::before {
    content: "";
    width: 46px;
    height: 3px;
    background: #4f7cff;
  }

  h1 {
    font: 900 120px/0.92 "Big Shoulders Display", sans-serif;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    color: #f4f5f7;
    max-width: 900px;
  }
  h1 .thin { color: #82a2ff; }

  .tagline {
    margin-top: 24px;
    font: 400 30px/1.45 "IBM Plex Sans", sans-serif;
    color: #9aa0ac;
    max-width: 760px;
  }

  .chips {
    display: flex;
    gap: 14px;
    margin-top: 36px;
  }
  .chip {
    font: 600 22px/1 "IBM Plex Sans", sans-serif;
    color: #f4f5f7;
    background: #121218;
    border: 1px solid rgba(244, 245, 247, 0.16);
    border-radius: 999px;
    padding: 14px 26px;
  }

  .url {
    position: absolute;
    left: 88px;
    bottom: 54px;
    font: 600 22px/1 "IBM Plex Sans", sans-serif;
    color: #5b6270;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="circle"></div>
    <div class="circle-inner"></div>
    <div class="glow"></div>

    <div class="kicker">Choose · Compare · Conquer</div>
    <h1>Football<br>Battle <span class="thin">Arena</span></h1>
    <p class="tagline">Every club is a battle team led by its captain — pick a side, run the sim, take the cup.</p>

    <div class="chips">
      <span class="chip">24 Clubs</span>
      <span class="chip">6 Leagues</span>
      <span class="chip">1 Arena Cup</span>
    </div>

    <div class="url">football-battle-arena.vercel.app</div>
  </div>
</body>
</html>
